name = "cat-personality-codes"
main = "src/index.js"
compatibility_date = "2026-09-08"

# D1 数据库绑定（部署后替换 database_id）
[[d1_databases]]
binding = "DB"
database_name = "cat-personality-codes-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 允许跨域（你的 Pages 域名）
[vars]
# 生产时建议改成你的 Pages 域名，例如：
# ALLOWED_ORIGIN = "https://cat-personality-test-ca6.pages.dev"
ALLOWED_ORIGIN = "*"
